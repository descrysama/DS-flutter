name: login_app_plus
description: "Application de connexion Flutter avec authentification via une API REST."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # Requêtes HTTP vers l'API REST
  http: ^1.2.2
  # Gestion d'état (ChangeNotifier)
  provider: ^6.1.2
  # Stockage sécurisé du token (Keychain iOS / Keystore Android)
  flutter_secure_storage: ^9.2.2

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
